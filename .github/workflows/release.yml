name: Build App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    runs-on: xcode-27
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read app version
        id: version
        shell: bash
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Invalid app version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and verify app
        run: bash ./build.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent calendarLens.app "$RUNNER_TEMP/calendarLens-macOS.zip"
      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: calendarLens-macOS
          path: ${{ runner.temp }}/calendarLens-macOS.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download app artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name calendarLens-macOS --dir package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$APP_VERSION" package/calendarLens-macOS.zip \
            --target "$GITHUB_SHA" --title "calendarLens v$APP_VERSION" --notes "" --latest
